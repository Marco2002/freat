<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Arpeggio Drill">
  <title>Arpeggio Drill</title>
  <!-- Small-size cut of the mark: frets dropped, strings weighted up and pushed
       darker so the climb still reads at 16px against light browser chrome. -->
  <rect width="512" height="512" rx="112" fill="#f0eee9"/>
  <g stroke="#29261b" opacity="0.45" stroke-linecap="round">
    <path d="M88 136H424" stroke-width="6"/>
    <path d="M88 216H424" stroke-width="8"/>
    <path d="M88 296H424" stroke-width="10"/>
    <path d="M88 376H424" stroke-width="13"/>
  </g>
  <circle cx="128" cy="376" r="32" fill="#e0a458"/>
  <circle cx="213" cy="296" r="32" fill="#29261b"/>
  <circle cx="299" cy="216" r="32" fill="#29261b"/>
  <circle cx="384" cy="136" r="32" fill="#c1551f"/>
</svg>
